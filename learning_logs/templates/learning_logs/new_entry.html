{%extends 'learning_logs/base.html'%}
{% load bootstrap4 %}
{% block page_header %}<a href="{%url 'learning_logs:topic' topic.id%}">{{topic}}</a>{% endblock page_header %}
{%block content%}
<p>Add a new entry for {{topic.text}}: </p>
<form action="{%url 'learning_logs:new_entry' topic.id%}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit">Submit</button>
</form>
{%endblock content%}
