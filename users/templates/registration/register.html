{% extends 'learning_logs/base.html' %}
{% load bootstrap4 %}

{% block page_header %}
  <h2>Register an account</h2>
{% endblock page_header %}

{% block content %}
  <style>
    /* 1. Hide password help text initially */
    .form-group:has(input[type="password"]) .form-text,
    .form-group:has(input[type="password"]) ul {
      display: none;
    }

    /* 2. Show help text when the password input is focused or typed in */
    .form-group:has(input[type="password"]:focus) .form-text,
    .form-group:has(input[type="password"]:focus) ul {
      display: block;
    }
  </style>

  <div class="row">
    <div class="col-md-6">
      <form method="post" action="{% url 'users:register' %}" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}

        {% buttons %}
          <button name="submit" class="btn btn-primary mt-2">Register</button>
        {% endbuttons %}
      </form>
    </div>
  </div>
{% endblock content %}
